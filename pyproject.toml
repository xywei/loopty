[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopty"
version = "0.1.0.dev0"
description = "loopy, with types. A typed polyhedral layer over loopy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Xiaoyu Wei" }]
keywords = [
    "loopy",
    "polyhedral",
    "isl",
    "code-generation",
    "types",
    "lanky",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    # islpy 2026 removed methods loopy 2025.2 still calls (Aff.is_equal in
    # simplify_pw_aff, BasicMap.is_bijective in map_domain), so code generation
    # for a tiled loop nest and the skew transform both fail against it. Drop
    # the ceiling once a loopy release supports islpy 2026.
    "islpy<2026",
    "loopy",
    "pymbolic",
    "lanky>=0.1.0.dev0",
]

[project.optional-dependencies]
# Device execution. Never installed on a laptop: the OpenCL target runs on the
# remote hosts only.
opencl = ["pyopencl"]

[project.urls]
Homepage = "https://github.com/xywei/loopty"
Repository = "https://github.com/xywei/loopty"

[project.scripts]
loopty = "loopty.cli:main"

# The plugin surface lanky discovers by entry point. lanky never imports loopty;
# it finds these groups and asks each object what it can do.
[project.entry-points."lanky.theories"]
loopty = "loopty.plugin:KernelTheory"

[project.entry-points."lanky.oracles"]
loopty = "loopty.plugin:IslOracle"

[project.entry-points."lanky.executors"]
loopty = "loopty.plugin:LoopyExecutor"

[project.entry-points."lanky.verbs"]
run = "loopty.plugin:RunVerb"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
lanky = { path = "../lanky", editable = true }

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

# A kernel's annotations are evaluated by lanky in a scope that invents unknown
# names, so a size such as `n` in `Arr[Fin[n], Real]` has no binding anywhere in
# the file and ruff's undefined-name rule cannot know that. Any file carrying
# kernel or theorem statements needs this ignore.
[tool.ruff.lint.per-file-ignores]
"tests/kernels/*.py" = ["F821"]
"examples/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Deprecations are errors, so that one of ours cannot hide in the noise of a
# run that compiles C. The three exceptions are loopy's own and cannot be avoided
# from here; all are recorded in docs/loopy-notes.md.
#   * loopy 2025.2 builds its C toolchain with codepy's deprecated
#     `Toolchain.copy`, inside `ExecutableCTarget.__init__`, before loopty is
#     given anything to hold.
#   * `lp.map_domain` (which the skew uses) requires an `isl.BasicMap` and then
#     asks it `is_bijective`, which islpy answers by converting implicitly.
#     Passing a `Map` instead is refused by loopy's own `_find_aff_subst_from_map`.
#   * `simplify_pw_aff` asks `Aff.is_equal` during code generation for a loop
#     with a piecewise bound. Hidden behind loopy's persistent codegen cache on
#     a warm machine; a cold CI runner always reaches it.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:'GCCToolchain.copy' is deprecated:DeprecationWarning",
    "ignore:BasicMap.is_bijective with implicit conversion:DeprecationWarning",
    "ignore:Aff.is_equal with implicit conversion:DeprecationWarning",
]
