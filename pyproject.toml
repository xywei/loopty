[build-system]
# license-files and the SPDX license expression are PEP 639, which hatchling
# supports from 1.27.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loopty"
version = "0.1.0"
description = "loopy, with types. A typed polyhedral layer over loopy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Xiaoyu Wei" }]
keywords = [
    "loopy",
    "polyhedral",
    "isl",
    "code-generation",
    "types",
    "lanky",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
# The floors and ceilings are what a release installed from PyPI has to get,
# and docs/loopy-notes.md has the long form of each.
dependencies = [
    # loopty computes each operation in the type numpy computes it in natively,
    # and that is NEP 50's promotion, numpy's own from 2.0.
    "numpy>=2",
    # islpy 2026 removed a method loopy 2025.2 still calls (Aff.is_equal in
    # simplify_pw_aff), so code generation for a tiled loop nest fails against
    # it (note 4). 2025.2.5 is loopy 2025.2's own floor. Drop the ceiling once a
    # loopy release supports islpy 2026. islpy 2025 has no wheels for Python
    # 3.14, which is why the classifiers and CI stop at 3.13.
    "islpy>=2025.2.5,<2026",
    # loopty builds on loopy's internals, not only its interface: its C and
    # OpenCL targets, their code builders and their expression mappers subclass
    # loopy's, and the target-capability check lists the limits of loopy 2025.2
    # and no others. So a release is held to the loopy it is tested with, and a
    # new loopy is a new release of loopty.
    "loopy>=2025.2,<2025.3",
    "pymbolic>=2025.1",
    # A plugin of lanky's, through the entry points below. In a checkout,
    # [tool.uv.sources] resolves it from ../lanky instead; a built
    # distribution names this requirement and nothing about the path.
    "lanky>=0.1.0",
]

[project.optional-dependencies]
# Device execution, `--target opencl`. pyopencl is imported only when an
# OpenCL kernel is built or run, and the floor is that of loopy's own pyopencl
# target, which loopty's is built on. CI never runs a device; the runs on real
# devices are in docs/device-runs.md.
opencl = ["pyopencl>=2022.3"]

[project.urls]
Homepage = "https://github.com/xywei/loopty"
Repository = "https://github.com/xywei/loopty"
Documentation = "https://github.com/xywei/loopty/blob/main/docs/quickstart.md"
Changelog = "https://github.com/xywei/loopty/blob/main/CHANGELOG.md"
Issues = "https://github.com/xywei/loopty/issues"

[project.scripts]
loopty = "loopty.cli:main"

# The plugin surface lanky discovers by entry point. lanky never imports loopty;
# it finds these groups and asks each object what it can do.
[project.entry-points."lanky.theories"]
loopty = "loopty.plugin:KernelTheory"

[project.entry-points."lanky.oracles"]
loopty = "loopty.plugin:IslOracle"

[project.entry-points."lanky.executors"]
loopty = "loopty.plugin:LoopyExecutor"

[project.entry-points."lanky.verbs"]
run = "loopty.plugin:RunVerb"

# The sdist is the source a downstream packager builds and tests from: the
# package, its tests, the examples, the documentation whose transcripts the
# tests and the refresh script compare with a real run, and that script.
# Named rather than left to the default, which takes every file git does not
# ignore, so that a stray file in a checkout never ships. (pyproject.toml, the
# README and the license file go in regardless.)
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/scripts",
    "/CHANGELOG.md",
]

[dependency-groups]
dev = ["pytest", "ruff"]

# Development only: uv resolves lanky from a sibling checkout, which is what CI
# lays out too. A built sdist or wheel carries the requirement above instead.
[tool.uv.sources]
lanky = { path = "../lanky", editable = true }

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

# A kernel's annotations are evaluated by lanky in a scope that invents unknown
# names, so a size such as `n` in `Arr[Fin[n], Real]` has no binding anywhere in
# the file and ruff's undefined-name rule cannot know that. Any file carrying
# kernel or theorem statements needs this ignore.
[tool.ruff.lint.per-file-ignores]
"tests/kernels/*.py" = ["F821"]
"examples/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Deprecations are errors, so that one of ours cannot hide in the noise of a
# run that compiles C. The two exceptions are loopy's own and cannot be avoided
# from here; both are recorded in docs/loopy-notes.md.
#   * loopy 2025.2 builds its C toolchain with codepy's deprecated
#     `Toolchain.copy`, inside `ExecutableCTarget.__init__`, before loopty is
#     given anything to hold.
#   * `simplify_pw_aff` asks `Aff.is_equal` during code generation for a loop
#     with a piecewise bound. Hidden behind loopy's persistent codegen cache on
#     a warm machine; a cold CI runner always reaches it.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:'GCCToolchain.copy' is deprecated:DeprecationWarning",
    "ignore:Aff.is_equal with implicit conversion:DeprecationWarning",
]
